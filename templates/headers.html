{% extends "base.html" %}
{% block title %}Soep Headers{% endblock %}
{% block card_min_width %}640px{% endblock %}
{% block content %}
    <h1>HTTP Headers</h1>

    {% for name, value in headers.items() %}
    <div class="row">
      <div class="row-label">{{ name }}</div>
      <div class="row-value">{{ value }}</div>
    </div>
    {% endfor %}
{% endblock %}
